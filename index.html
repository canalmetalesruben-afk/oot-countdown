<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color"
      content="#06110d">

<meta name="description"
      content="Cuenta atrás para The Legend of Zelda: Ocarina of Time Remake">

<link rel="manifest"
      href="./manifest.json">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icon-192-shield.png">

<link rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icon-512-shield.png">

<link rel="apple-touch-icon"
      href="./icon-192-shield.png">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="application-name"
      content="OoT Countdown">

<title>OoT Countdown</title>


<style>

/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  background:#020604;

  color:#f2e6c5;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  overflow-x:hidden;
}


/* =====================================================
   FONDO
===================================================== */

.background{

  position:fixed;

  inset:0;

  z-index:-20;

  background-image:

    linear-gradient(
      rgba(0,0,0,.35),
      rgba(0,3,2,.78)
    ),

    url("./hyrule-bg.png");

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;
}


.background:after{

  content:"";

  position:absolute;

  inset:0;

  background:

    radial-gradient(
      ellipse at center,
      transparent 15%,
      rgba(0,0,0,.22) 60%,
      rgba(0,0,0,.72) 100%
    );
}


.ambient-glow{

  position:fixed;

  width:500px;
  height:500px;

  left:50%;
  top:42%;

  transform:
    translate(-50%,-50%);

  background:

    radial-gradient(
      circle,
      rgba(226,191,92,.10),
      transparent 70%
    );

  filter:blur(20px);

  pointer-events:none;

  z-index:-10;
}


/* =====================================================
   LOGO
===================================================== */

.logo-wrap{

  position:relative;

  display:inline-block;

  width:min(88vw,680px);

  overflow:visible;

  animation:
    logoIntro 1.2s ease-out;
}


.logo{

  display:block;

  width:100%;

  height:auto;

  max-height:none;

  object-fit:contain;

  filter:

    drop-shadow(
      0 6px 10px rgba(0,0,0,.9)
    )

    drop-shadow(
      0 0 20px rgba(220,185,80,.18)
    );
}


@keyframes logoIntro{

  from{

    opacity:0;

    transform:
      translateY(-15px)
      scale(.96);
  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* =====================================================
   HERO
===================================================== */

.hero{

  width:100%;

  max-width:900px;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  padding-top:15px;
}


.subtitle{

  margin-top:3px;

  color:#ead9a8;

  font-size:
    clamp(18px,4.5vw,28px);

  font-style:italic;

  letter-spacing:2px;

  text-shadow:

    0 2px 8px rgba(0,0,0,.9),

    0 0 15px
      rgba(225,190,90,.18);
}


/* =====================================================
   NAVI
===================================================== */

#navi{

  position:fixed;

  width:
    clamp(72px,13vw,105px);

  height:auto;

  left:0;

  top:0;

  z-index:15;

  pointer-events:none;

  display:block;

  visibility:visible;

  opacity:1;

  filter:

    drop-shadow(
      0 0 7px
      rgba(80,200,255,.75)
    )

    drop-shadow(
      0 0 15px
      rgba(50,160,255,.35)
    );

  will-change:
    transform,
    left,
    top;
}


/* =====================================================
   DESTELLOS DE NAVI
===================================================== */

.navi-spark{

  position:fixed;

  width:4px;

  height:4px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,

      rgba(255,255,255,1)
        0%,

      rgba(150,225,255,.9)
        35%,

      rgba(90,180,255,.2)
        70%,

      transparent
        100%
    );

  pointer-events:none;

  z-index:14;

  animation:
    sparkFade .9s ease-out forwards;
}


@keyframes sparkFade{

  0%{

    opacity:.95;

    transform:
      scale(1.4);
  }

  100%{

    opacity:0;

    transform:
      scale(.1)
      translateY(8px);
  }

}


/* =====================================================
   LUCIÉRNAGAS
===================================================== */

.firefly{

  position:fixed;

  width:3px;

  height:3px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,

      rgba(255,245,185,1),

      rgba(225,190,85,.6)
        35%,

      transparent
        75%
    );

  box-shadow:

    0 0 5px
    rgba(245,220,120,.55);

  pointer-events:none;

  z-index:2;

  animation:

    fireflyFloat
    var(--duration)
    ease-in-out
    infinite;
}


@keyframes fireflyFloat{

  0%{

    opacity:0;

    transform:
      translate(0,0)
      scale(.5);
  }

  20%{

    opacity:
      var(--brightness);
  }

  50%{

    transform:

      translate(
        var(--move-x),
        var(--move-y)
      )

      scale(1);
  }

  75%{

    opacity:
      var(--brightness);
  }

  100%{

    opacity:0;

    transform:

      translate(
        calc(var(--move-x)*-.5),
        calc(var(--move-y)*-.5)
      )

      scale(.4);
  }

}


/* =====================================================
   BOTÓN DE OCARINA
===================================================== */

.music-button{

  position:fixed;

  top:16px;

  right:16px;

  z-index:50;

  width:52px;

  height:52px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0;

  border:

    1px solid
    rgba(220,190,105,.55);

  border-radius:50%;

  background:

    rgba(3,12,8,.72);

  color:#d9bd72;

  cursor:pointer;

  backdrop-filter:blur(6px);

  box-shadow:

    0 4px 18px
    rgba(0,0,0,.4);

  transition:

    border-color .3s ease,

    box-shadow .3s ease,

    transform .2s ease,

    color .3s ease;
}


.music-button:active{

  transform:scale(.92);
}


/* OCARINA SVG */

.ocarina-icon{

  width:31px;

  height:31px;

  display:block;

  color:#d9bd72;

  filter:

    drop-shadow(
      0 2px 3px
      rgba(0,0,0,.7)
    );

  transition:

    filter .4s ease,

    color .4s ease,

    transform .4s ease;
}


/* MÚSICA ACTIVA */

.music-button.playing{

  color:#f2d889;

  border-color:

    rgba(240,210,120,.9);

  box-shadow:

    0 0 18px
    rgba(220,190,90,.32),

    inset 0 0 12px
    rgba(220,190,90,.08);
}


.music-button.playing
.ocarina-icon{

  color:#f2d889;

  filter:

    drop-shadow(
      0 0 4px
      rgba(245,215,125,.75)
    )

    drop-shadow(
      0 0 10px
      rgba(220,190,90,.35)
    );

  transform:scale(1.04);
}


/* =====================================================
   CONTENIDO
===================================================== */

.page{

  width:100%;

  min-height:100vh;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding:

    max(
      25px,
      env(safe-area-inset-top)
    )

    16px

    max(
      25px,
      env(safe-area-inset-bottom)
    );
}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

.countdown-section{

  width:100%;

  max-width:900px;

  margin-top:28px;

  text-align:center;
}


.date{

  color:#d9c486;

  font-size:
    clamp(12px,3vw,17px);

  letter-spacing:
    clamp(3px,1.3vw,7px);

  margin-bottom:15px;
}


.countdown{

  width:100%;

  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:
    clamp(
      6px,
      1.8vw,
      16px
    );
}


.time-box{

  min-width:0;

  min-height:
    clamp(
      88px,
      18vw,
      125px
    );

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:8px;

  border:

    1px solid
    rgba(220,190,105,.42);

  border-radius:9px;

  background:

    linear-gradient(
      145deg,
      rgba(5,18,12,.82),
      rgba(1,6,4,.92)
    );

  box-shadow:

    inset 0 0 25px
    rgba(0,0,0,.45),

    0 7px 25px
    rgba(0,0,0,.35);

  backdrop-filter:blur(5px);
}


.number{

  color:#f0dda4;

  font-size:
    clamp(
      28px,
      7vw,
      60px
    );

  line-height:1;

  white-space:nowrap;

  text-shadow:

    0 0 12px
    rgba(235,205,120,.22);
}


.label{

  margin-top:10px;

  color:
    rgba(230,215,175,.72);

  font-size:
    clamp(
      7px,
      1.8vw,
      11px
    );

  letter-spacing:
    clamp(
      1px,
      .7vw,
      3px
    );

  text-transform:uppercase;

  white-space:nowrap;
}


/* =====================================================
   COMPARTIR
===================================================== */

.share-button{

  margin-top:24px;

  padding:13px 28px;

  min-width:230px;

  border:

    1px solid
    rgba(220,190,105,.48);

  border-radius:40px;

  background:

    rgba(3,12,8,.65);

  color:#e4d199;

  font-family:

    Georgia,
    "Times New Roman",
    serif;

  font-size:11px;

  letter-spacing:3px;

  cursor:pointer;

  backdrop-filter:blur(5px);

  transition:.25s ease;
}


.share-button:hover{

  border-color:#e7cc7b;

  background:
    rgba(50,45,20,.45);

  box-shadow:

    0 0 20px
    rgba(220,190,100,.16);
}


.share-button:active{

  transform:scale(.96);
}


/* =====================================================
   MÓVIL / FOLD CERRADO
===================================================== */

@media(max-width:500px){

  .page{

    padding-left:12px;

    padding-right:12px;
  }


  .hero{

    padding-top:8px;
  }


  .logo-wrap{

    width:86vw;

    max-height:none;

    overflow:visible;
  }


  .subtitle{

    font-size:17px;

    letter-spacing:1.5px;
  }


  .countdown-section{

    margin-top:24px;
  }


  .date{

    font-size:10px;

    letter-spacing:3.5px;
  }


  .countdown{

    gap:5px;
  }


  .time-box{

    min-height:82px;

    padding:5px;
  }


  .number{

    font-size:
      clamp(
        25px,
        8vw,
        38px
      );
  }


  .label{

    font-size:7px;

    letter-spacing:1px;
  }


  .share-button{

    min-width:215px;

    padding:12px 20px;

    font-size:10px;
  }


  #navi{

    width:82px;
  }


  .music-button{

    top:12px;

    right:12px;

    width:44px;

    height:44px;
  }


  .ocarina-icon{

    width:27px;

    height:27px;
  }

}


/* =====================================================
   FIN CSS
===================================================== */

</style>

</head>


<body>


<!-- ===================================================
     FONDO
=================================================== -->

<div class="background"></div>

<div class="ambient-glow"></div>


<!-- ===================================================
     MÚSICA
=================================================== -->

<audio

  id="templeMusic"

  src="./temple-of-time.mp3"

  loop

  preload="auto"

  autoplay>

</audio>


<!-- ===================================================
     BOTÓN OCARINA
=================================================== -->

<button

  id="musicButton"

  class="music-button"

  aria-label="Activar o desactivar música">


  <svg

    class="ocarina-icon"

    viewBox="0 0 100 70"

    xmlns="http://www.w3.org/2000/svg"

    aria-hidden="true">


    <title>
      Música
    </title>


    <!-- Cuerpo de la ocarina -->

    <path

      d="
        M18 38

        C12 34 13 25 20 21

        C27 17 38 18 47 22

        C57 26 66 26 76 22

        C84 19 91 23 92 30

        C94 39 87 47 79 49

        C68 52 57 49 48 46

        C39 43 29 44 23 43

        C21 42 19 40 18 38Z
      "

      fill="none"

      stroke="currentColor"

      stroke-width="4"

      stroke-linejoin="round"/>


    <!-- Agujeros -->

    <circle
      cx="31"
      cy="29"
      r="4"
      fill="currentColor"/>


    <circle
      cx="43"
      cy="34"
      r="4"
      fill="currentColor"/>


    <circle
      cx="55"
      cy="37"
      r="4"
      fill="currentColor"/>


    <circle
      cx="68"
      cy="34"
      r="4"
      fill="currentColor"/>


    <!-- Boquilla -->

    <path

      d="
        M20 22

        C17 16 18 11 24 8

        C29 6 34 9 35 14

        L35 20
      "

      fill="none"

      stroke="currentColor"

      stroke-width="4"

      stroke-linecap="round"/>


  </svg>

</button>


<!-- ===================================================
     NAVI
=================================================== -->

<img

  id="navi"

  src="./navi-clean.png"

  alt="">


<!-- ===================================================
     CONTENIDO PRINCIPAL
=================================================== -->

<main class="page">


  <!-- LOGO -->

  <section class="hero">


    <div class="logo-wrap">


      <img

        class="logo"

        src="./oot-logo.png"

        alt="The Legend of Zelda Ocarina of Time">


    </div>


    <div class="subtitle">

      «Vuelve la leyenda...»

    </div>


  </section>



  <!-- CUENTA ATRÁS -->

  <section class="countdown-section">


    <div class="date">

      5 · NOVIEMBRE · 2026

    </div>


    <div class="countdown">


      <div class="time-box">

        <div
          id="days"
          class="number">

          000

        </div>

        <div class="label">

          Días

        </div>

      </div>



      <div class="time-box">

        <div
          id="hours"
          class="number">

          00

        </div>

        <div class="label">

          Horas

        </div>

      </div>



      <div class="time-box">

        <div
          id="minutes"
          class="number">

          00

        </div>

        <div class="label">

          Minutos

        </div>

      </div>



      <div class="time-box">

        <div
          id="seconds"
          class="number">

          00

        </div>

        <div class="label">

          Segundos

        </div>

      </div>


    </div>


    <button

      id="shareButton"

      class="share-button">

      COMPARTIR CUENTA ATRÁS

    </button>


  </section>


</main>



<script>


/* =====================================================
   CUENTA ATRÁS
===================================================== */


const targetDate =

  new Date(
    "2026-11-05T00:00:00+01:00"
  ).getTime();


const daysElement =

  document.getElementById(
    "days"
  );


const hoursElement =

  document.getElementById(
    "hours"
  );


const minutesElement =

  document.getElementById(
    "minutes"
  );


const secondsElement =

  document.getElementById(
    "seconds"
  );


function updateCountdown(){


  const difference =

    targetDate -
    Date.now();


  if(difference <= 0){

    daysElement.textContent =
      "0";

    hoursElement.textContent =
      "00";

    minutesElement.textContent =
      "00";

    secondsElement.textContent =
      "00";

    return;

  }


  const totalSeconds =

    Math.floor(
      difference / 1000
    );


  const days =

    Math.floor(
      totalSeconds / 86400
    );


  const hours =

    Math.floor(
      (totalSeconds % 86400) /
      3600
    );


  const minutes =

    Math.floor(
      (totalSeconds % 3600) /
      60
    );


  const seconds =

    totalSeconds % 60;


  /*
     DÍAS SIN CERO DELANTE
     52 en lugar de 052
  */

  daysElement.textContent =
    String(days);


  hoursElement.textContent =

    String(hours)
      .padStart(2,"0");


  minutesElement.textContent =

    String(minutes)
      .padStart(2,"0");


  secondsElement.textContent =

    String(seconds)
      .padStart(2,"0");

}


updateCountdown();


setInterval(
  updateCountdown,
  1000
);



/* =====================================================
   LUCIÉRNAGAS
===================================================== */


for(let i=0;i<26;i++){


  const firefly =

    document.createElement(
      "div"
    );


  firefly.className =
    "firefly";


  firefly.style.left =

    Math.random()*100 +
    "vw";


  firefly.style.top =

    Math.random()*100 +
    "vh";


  firefly.style.setProperty(

    "--duration",

    (5 + Math.random()*8) +
    "s"

  );


  firefly.style.setProperty(

    "--move-x",

    (-35 + Math.random()*70) +
    "px"

  );


  firefly.style.setProperty(

    "--move-y",

    (-45 + Math.random()*90) +
    "px"

  );


  firefly.style.setProperty(

    "--brightness",

    (0.25 + Math.random()*0.55)

  );


  firefly.style.animationDelay =

    (-Math.random()*8) +
    "s";


  document.body.appendChild(
    firefly
  );

}



/* =====================================================
   NAVI
===================================================== */


const navi =

  document.getElementById(
    "navi"
  );


let naviReady = false;


let naviX =

  window.innerWidth * .15;


let naviY =

  window.innerHeight * .30;


let targetX =

  window.innerWidth * .75;


let targetY =

  window.innerHeight * .55;


let lastSpark = 0;



navi.addEventListener(

  "load",

  () => {

    naviReady = true;

  }

);


navi.addEventListener(

  "error",

  () => {

    naviReady = false;

  }

);



function chooseNaviTarget(){


  const margin = 30;


  targetX =

    margin +

    Math.random() *

    Math.max(
      1,
      window.innerWidth - 100
    );


  targetY =

    100 +

    Math.random() *

    Math.max(
      1,
      window.innerHeight - 220
    );

}



function createNaviSpark(){


  if(!naviReady){

    return;

  }


  const spark =

    document.createElement(
      "div"
    );


  spark.className =
    "navi-spark";


  spark.style.left =

    (

      naviX +
      35 +
      Math.random()*30

    ) +

    "px";


  spark.style.top =

    (

      naviY +
      35 +
      Math.random()*30

    ) +

    "px";


  const size =

    2 +
    Math.random()*4;


  spark.style.width =
    size + "px";


  spark.style.height =
    size + "px";


  document.body.appendChild(
    spark
  );


  setTimeout(

    () =>
      spark.remove(),

    900

  );

}



function animateNavi(time){


  const dx =

    targetX -
    naviX;


  const dy =

    targetY -
    naviY;


  const distance =

    Math.sqrt(
      dx*dx +
      dy*dy
    );


  if(distance < 12){

    chooseNaviTarget();

  }

  else{


    const speed =

      .0015 *
      distance;


    naviX +=
      dx * speed;


    naviY +=
      dy * speed;

  }


  const swayX =

    Math.sin(
      time*.0023
    ) * 8;


  const swayY =

    Math.cos(
      time*.0017
    ) * 7;


  const angle =

    Math.atan2(
      dy,
      dx
    ) *

    180 /
    Math.PI;


  navi.style.left =

    naviX +
    "px";


  navi.style.top =

    naviY +
    "px";


  navi.style.transform =

    `translate(${swayX}px,${swayY}px)
     rotate(${angle*.12}deg)`;


  if(

    naviReady &&

    time -
    lastSpark >
    150

  ){

    createNaviSpark();

    lastSpark =
      time;

  }


  requestAnimationFrame(
    animateNavi
  );

}


chooseNaviTarget();


requestAnimationFrame(
  animateNavi
);



/* =====================================================
   MÚSICA
===================================================== */


const music =

  document.getElementById(
    "templeMusic"
  );


const musicButton =

  document.getElementById(
    "musicButton"
  );


music.volume = .35;



function setMusicUI(
  playing
){

  musicButton.classList.toggle(

    "playing",

    playing

  );

}



async function tryStartMusic(){


  if(!music.paused){

    setMusicUI(true);

    return true;

  }


  try{

    await music.play();

    setMusicUI(true);

    localStorage.setItem(
      "ootMusicEnabled",
      "1"
    );

    return true;

  }

  catch(error){

    return false;

  }

}


/*
   Intento de autoplay
*/

window.addEventListener(

  "load",

  () => {

    tryStartMusic();

  }

);



/*
   Si el navegador bloquea
   el autoplay, el primer
   toque intenta arrancarlo.
*/

let musicUnlocked = false;


async function unlockMusicFromInteraction(){


  if(musicUnlocked){

    return;

  }


  musicUnlocked = true;


  await tryStartMusic();


  [
    "pointerdown",
    "touchstart",
    "keydown"
  ]

  .forEach(

    type => {

      document.removeEventListener(

        type,

        unlockMusicFromInteraction

      );

    }

  );

}


[
  "pointerdown",
  "touchstart",
  "keydown"
]

.forEach(

  type => {

    document.addEventListener(

      type,

      unlockMusicFromInteraction,

      {passive:true}

    );

  }

);



/*
   Botón de la ocarina
*/

musicButton.addEventListener(

  "click",

  async () => {


    if(music.paused){

      await tryStartMusic();

    }

    else{

      music.pause();

      setMusicUI(false);

      localStorage.setItem(
        "ootMusicEnabled",
        "0"
      );

    }

  }

);



/* =====================================================
   COMPARTIR
===================================================== */


document

  .getElementById(
    "shareButton"
  )

  .addEventListener(

    "click",

    async () => {


      const shareData = {


        title:
          "OoT Countdown",


        text:
          "¡Vuelve la leyenda! Cuenta atrás para Ocarina of Time Remake.",


        url:
          window.location.href

      };


      try{


        if(navigator.share){

          await navigator.share(
            shareData
          );

        }


        else{


          await navigator.clipboard

            .writeText(
              window.location.href
            );


          alert(
            "¡Enlace copiado!"
          );

        }

      }

      catch(error){}


    }

  );



/* =====================================================
   SERVICE WORKER
===================================================== */


if(
  "serviceWorker"
  in navigator
){

  window.addEventListener(

    "load",

    () => {


      navigator.serviceWorker

        .register(
          "./service-worker.js"
        )

        .catch(

          error =>

            console.log(
              "Service Worker:",
              error
            )

        );

    }

  );

}


</script>
