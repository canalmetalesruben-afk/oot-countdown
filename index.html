<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#06110d">

<meta name="description"
      content="Cuenta atrás para The Legend of Zelda: Ocarina of Time Remake">

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icon-192-shield.png">

<link rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icon-512-shield.png">

<link rel="apple-touch-icon"
      href="./icon-192-shield.png">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="application-name"
      content="OoT Countdown">

<title>OoT Countdown</title>


<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    background: #020604;

    color: #f2e6c5;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    overflow-x: hidden;
}


/* =====================================================
   FONDO
===================================================== */

.background {

    position: fixed;

    inset: 0;

    z-index: -10;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,3,2,0.78)
        ),
        url("./hyrule-bg.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;
}


.background::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 15%,
            rgba(0,0,0,0.25) 60%,
            rgba(0,0,0,0.72) 100%
        );
}


/* =====================================================
   BRILLO AMBIENTAL
===================================================== */

.ambient-glow {

    position: fixed;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 42%;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(226,191,92,0.10),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;

    z-index: -5;
}


/* =====================================================
   CONTENEDOR PRINCIPAL
===================================================== */

.page {

    width: 100%;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding:
        max(25px, env(safe-area-inset-top))
        16px
        max(25px, env(safe-area-inset-bottom));
}


/* =====================================================
   LOGO
===================================================== */

.hero {

    width: 100%;

    max-width: 900px;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    padding-top: 15px;
}


.logo {

    display: block;

    width: min(92vw, 680px);

    height: auto;

    max-height: 250px;

    object-fit: contain;

    filter:
        drop-shadow(0 6px 10px rgba(0,0,0,0.9))
        drop-shadow(0 0 20px rgba(220,185,80,0.18));

    animation:
        logoIntro 1.2s ease-out;
}


@keyframes logoIntro {

    from {

        opacity: 0;

        transform:
            translateY(-15px)
            scale(0.96);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }
}


/* =====================================================
   FRASE
===================================================== */

.subtitle {

    margin-top: 3px;

    color: #ead9a8;

    font-size:
        clamp(18px, 4.5vw, 28px);

    font-style: italic;

    letter-spacing: 2px;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.9),
        0 0 15px rgba(225,190,90,0.18);
}


/* =====================================================
   FECHA
===================================================== */

.countdown-section {

    width: 100%;

    max-width: 900px;

    margin-top: 28px;

    text-align: center;
}


.date {

    color: #d9c486;

    font-size:
        clamp(12px, 3vw, 17px);

    letter-spacing:
        clamp(3px, 1.3vw, 7px);

    margin-bottom: 15px;
}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

.countdown {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: clamp(6px, 1.8vw, 16px);
}


.time-box {

    min-width: 0;

    min-height:
        clamp(88px, 18vw, 125px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 8px;

    border:
        1px solid
        rgba(220,190,105,0.42);

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            rgba(5,18,12,0.82),
            rgba(1,6,4,0.92)
        );

    box-shadow:
        inset 0 0 25px rgba(0,0,0,0.45),
        0 7px 25px rgba(0,0,0,0.35);

    backdrop-filter:
        blur(5px);
}


.number {

    color: #f0dda4;

    font-size:
        clamp(28px, 7vw, 60px);

    line-height: 1;

    white-space: nowrap;

    text-shadow:
        0 0 12px
        rgba(235,205,120,0.22);
}


.label {

    margin-top: 10px;

    color:
        rgba(230,215,175,0.72);

    font-size:
        clamp(7px, 1.8vw, 11px);

    letter-spacing:
        clamp(1px, 0.7vw, 3px);

    text-transform: uppercase;

    white-space: nowrap;
}


/* =====================================================
   COMPARTIR
===================================================== */

.share-button {

    margin-top: 24px;

    padding:
        13px 28px;

    min-width: 230px;

    border:
        1px solid
        rgba(220,190,105,0.48);

    border-radius: 40px;

    background:
        rgba(3,12,8,0.65);

    color: #e4d199;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 11px;

    letter-spacing: 3px;

    cursor: pointer;

    backdrop-filter:
        blur(5px);

    transition:
        0.25s ease;
}


.share-button:hover {

    border-color: #e7cc7b;

    background:
        rgba(50,45,20,0.45);

    box-shadow:
        0 0 20px
        rgba(220,190,100,0.16);
}


.share-button:active {

    transform: scale(0.96);
}


/* =====================================================
   MENÚ
===================================================== */

.menu {

    width: 100%;

    max-width: 900px;

    margin-top: 40px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 13px;
}


.menu-button {

    min-height: 105px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(210,180,95,0.28);

    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            rgba(3,15,9,0.78),
            rgba(0,5,3,0.90)
        );

    color: #dbc78f;

    cursor: pointer;

    transition:
        0.25s ease;

    backdrop-filter:
        blur(5px);
}


.menu-button:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(225,195,110,0.65);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.4);
}


.menu-icon {

    font-size: 27px;

    margin-bottom: 9px;

    color: #dfc986;
}


.menu-title {

    font-size: 11px;

    letter-spacing: 4px;

    text-transform: uppercase;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,0.78);

    backdrop-filter:
        blur(7px);
}


.modal.active {

    display: flex;
}


.modal-box {

    width: 100%;

    max-width: 500px;

    padding: 30px 25px;

    border:
        1px solid
        rgba(220,190,105,0.45);

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            rgba(7,20,13,0.98),
            rgba(1,7,4,0.99)
        );

    box-shadow:
        0 20px 70px
        rgba(0,0,0,0.7);
}


.modal-box h2 {

    color: #e6d097;

    text-align: center;

    font-size: 23px;

    letter-spacing: 3px;

    margin-bottom: 15px;
}


.modal-box p {

    color: #cec5a7;

    text-align: center;

    font-size: 15px;

    line-height: 1.7;
}


.close-button {

    display: block;

    margin: 23px auto 0;

    padding: 10px 24px;

    border:
        1px solid
        rgba(220,190,105,0.42);

    border-radius: 30px;

    background: transparent;

    color: #dfcb91;

    font-family: Georgia, serif;

    cursor: pointer;
}


/* =====================================================
   PIE
===================================================== */

footer {

    margin-top: 35px;

    padding-bottom: 20px;

    text-align: center;

    color:
        rgba(220,205,160,0.42);

    font-size: 10px;

    letter-spacing: 4px;
}


.fan {

    margin-top: 9px;

    color:
        rgba(220,205,160,0.25);

    font-size: 8px;

    letter-spacing: 1.5px;
}


/* =====================================================
   MÓVILES
===================================================== */

@media (max-width: 500px) {

    .page {

        padding-left: 12px;

        padding-right: 12px;
    }


    .hero {

        padding-top: 8px;
    }


    .logo {

        width: 94vw;

        max-height: 175px;
    }


    .subtitle {

        font-size: 17px;

        letter-spacing: 1.5px;
    }


    .countdown-section {

        margin-top: 24px;
    }


    .date {

        font-size: 10px;

        letter-spacing: 3.5px;
    }


    .countdown {

        gap: 5px;
    }


    .time-box {

        min-height: 82px;

        padding: 5px;
    }


    .number {

        font-size: clamp(
            25px,
            8vw,
            38px
        );
    }


    .label {

        font-size: 7px;

        letter-spacing: 1px;
    }


    .share-button {

        min-width: 215px;

        padding: 12px 20px;

        font-size: 10px;
    }


    .menu {

        margin-top: 28px;

        gap: 9px;
    }


    .menu-button {

        min-height: 82px;
    }


    .menu-icon {

        font-size: 22px;

        margin-bottom: 7px;
    }


    .menu-title {

        font-size: 8px;

        letter-spacing: 2px;
    }


    footer {

        margin-top: 28px;
    }

}


/* =====================================================
   PANTALLAS MUY PEQUEÑAS
===================================================== */

@media (max-width: 360px) {

    .countdown {

        gap: 3px;
    }


    .time-box {

        min-height: 72px;
    }


    .number {

        font-size: 23px;
    }


    .label {

        font-size: 6px;
    }

}

</style>

</head>


<body>


<div class="background"></div>

<div class="ambient-glow"></div>


<main class="page">


    <!-- =================================================
         LOGO
    ================================================== -->

    <section class="hero">

        <img
            class="logo"
            src="./oot-logo.png"
            alt="The Legend of Zelda Ocarina of Time"
        >

        <div class="subtitle">
            «Vuelve la leyenda...»
        </div>

    </section>


    <!-- =================================================
         CUENTA ATRÁS
    ================================================== -->

    <section class="countdown-section">

        <div class="date">
            5 · NOVIEMBRE · 2026
        </div>


        <div class="countdown">

            <div class="time-box">

                <div
                    id="days"
                    class="number">
                    000
                </div>

                <div class="label">
                    Días
                </div>

            </div>


            <div class="time-box">

                <div
                    id="hours"
                    class="number">
                    00
                </div>

                <div class="label">
                    Horas
                </div>

            </div>


            <div class="time-box">

                <div
                    id="minutes"
                    class="number">
                    00
                </div>

                <div class="label">
                    Minutos
                </div>

            </div>


            <div class="time-box">

                <div
                    id="seconds"
                    class="number">
                    00
                </div>

                <div class="label">
                    Segundos
                </div>

            </div>

        </div>


        <button
            id="shareButton"
            class="share-button">

            COMPARTIR CUENTA ATRÁS

        </button>

    </section>


    <!-- =================================================
         MENÚ
    ================================================== -->

    <nav class="menu">


        <button
            class="menu-button"
            data-title="Noticias"
            data-text="Aquí reuniremos las noticias, anuncios y novedades más importantes relacionadas con Ocarina of Time Remake.">

            <span class="menu-icon">
                ✦
            </span>

            <span class="menu-title">
                Noticias
            </span>

        </button>


        <button
            class="menu-button"
            data-title="Galería"
            data-text="Imágenes, capturas y material visual del regreso de la leyenda.">

            <span class="menu-icon">
                ◇
            </span>

            <span class="menu-title">
                Galería
            </span>

        </button>


        <button
            class="menu-button"
            data-title="Música"
            data-text="Un espacio dedicado a la música y al sonido que acompañan esta nueva aventura.">

            <span class="menu-icon">
                ♫
            </span>

            <span class="menu-title">
                Música
            </span>

        </button>


        <button
            class="menu-button"
            data-title="Extras"
            data-text="Curiosidades, secretos, referencias y otros contenidos para los fans de Ocarina of Time.">

            <span class="menu-icon">
                ✧
            </span>

            <span class="menu-title">
                Extras
            </span>

        </button>


    </nav>


    <!-- =================================================
         PIE
    ================================================== -->

    <footer>

        HYRULE AWAITS

        <div class="fan">
            Proyecto fan no oficial · No afiliado con Nintendo
        </div>

    </footer>


</main>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modal"
    class="modal">


    <div class="modal-box">


        <h2 id="modalTitle">
            Noticias
        </h2>


        <p id="modalText">
        </p>


        <button
            id="closeModal"
            class="close-button">

            CERRAR

        </button>


    </div>

</div>


<script>

/* =====================================================
   CUENTA ATRÁS
===================================================== */

/*
   5 de noviembre de 2026
   00:00 hora española.

   En noviembre España utiliza CET (UTC+1).
*/

const targetDate =
    new Date(
        "2026-11-05T00:00:00+01:00"
    ).getTime();


const daysElement =
    document.getElementById("days");

const hoursElement =
    document.getElementById("hours");

const minutesElement =
    document.getElementById("minutes");

const secondsElement =
    document.getElementById("seconds");


function updateCountdown() {

    const now =
        Date.now();


    const difference =
        targetDate - now;


    if (difference <= 0) {

        daysElement.textContent =
            "000";

        hoursElement.textContent =
            "00";

        minutesElement.textContent =
            "00";

        secondsElement.textContent =
            "00";

        return;
    }


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    daysElement.textContent =
        String(days).padStart(3, "0");


    hoursElement.textContent =
        String(hours).padStart(2, "0");


    minutesElement.textContent =
        String(minutes).padStart(2, "0");


    secondsElement.textContent =
        String(seconds).padStart(2, "0");

}


/* Primera actualización */

updateCountdown();


/* Actualizar cada segundo */

setInterval(
    updateCountdown,
    1000
);


/* =====================================================
   COMPARTIR
===================================================== */

const shareButton =
    document.getElementById(
        "shareButton"
    );


shareButton.addEventListener(
    "click",
    async () => {

        const shareData = {

            title:
                "OoT Countdown",

            text:
                "¡Vuelve la leyenda! Cuenta atrás para Ocarina of Time Remake.",

            url:
                window.location.href

        };


        try {

            if (
                navigator.share
            ) {

                await navigator.share(
                    shareData
                );

            } else {

                await navigator.clipboard.writeText(
                    window.location.href
                );

                alert(
                    "¡Enlace copiado!"
                );

            }

        } catch (error) {

            /* El usuario canceló compartir */

        }

    }
);


/* =====================================================
   MENÚ / MODAL
===================================================== */

const modal =
    document.getElementById(
        "modal"
    );


const modalTitle =
    document.getElementById(
        "modalTitle"
    );


const modalText =
    document.getElementById(
        "modalText"
    );


const closeModal =
    document.getElementById(
        "closeModal"
    );


document
    .querySelectorAll(
        ".menu-button"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                modalTitle.textContent =
                    button.dataset.title;

                modalText.textContent =
                    button.dataset.text;

                modal.classList.add(
                    "active"
                );

            }
        );

    });


closeModal.addEventListener(
    "click",
    () => {

        modal.classList.remove(
            "active"
        );

    }
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================================
   SERVICE WORKER
===================================================== */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )
                .catch(
                    error => {

                        console.log(
                            "Service Worker:",
                            error
                        );

                    }
                );

        }
    );

}

</script>


</body>
</html>
