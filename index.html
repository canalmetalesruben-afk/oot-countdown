<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#06110d">

<meta name="description"
      content="Cuenta atrás para The Legend of Zelda: Ocarina of Time Remake">

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icon-192-shield.png">

<link rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icon-512-shield.png">

<link rel="apple-touch-icon"
      href="./icon-192-shield.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-status-bar-style"
      content="black-translucent">
<meta name="application-name"
      content="OoT Countdown">

<title>OoT Countdown</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #020604;
    color: #f4ead0;
    overflow-x: hidden;
}

/* =====================================================
   FONDO
===================================================== */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;

    background-image:
        linear-gradient(
            rgba(0, 0, 0, 0.42),
            rgba(0, 3, 2, 0.78)
        ),
        url("./hyrule-bg.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transform: scale(1.03);
}

/* Oscurecimiento cinematográfico */

.background::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 10%,
            rgba(0,0,0,0.30) 65%,
            rgba(0,0,0,0.75) 100%
        );
}

/* =====================================================
   LUZ AMBIENTAL
===================================================== */

.glow {
    position: fixed;
    width: 420px;
    height: 420px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    background: radial-gradient(
        circle,
        rgba(224,190,95,0.12),
        transparent 70%
    );

    filter: blur(20px);
    pointer-events: none;
    z-index: -5;
}

/* =====================================================
   NAVI
===================================================== */

#navi {
    position: fixed;

    width: clamp(95px, 25vw, 170px);

    left: -220px;
    top: 30%;

    z-index: 20;

    pointer-events: none;

    filter:
        drop-shadow(0 0 8px rgba(130,220,255,0.85))
        drop-shadow(0 0 22px rgba(80,180,255,0.45));

    animation: naviFlight 18s linear infinite;
}

@keyframes naviFlight {

    0% {
        left: -220px;
        top: 18%;
        transform:
            rotate(-8deg)
            scale(0.82);
    }

    12% {
        left: 12%;
        top: 25%;
        transform:
            rotate(5deg)
            scale(0.95);
    }

    25% {
        left: 45%;
        top: 14%;
        transform:
            rotate(-4deg)
            scale(1);
    }

    40% {
        left: 78%;
        top: 28%;
        transform:
            rotate(8deg)
            scale(0.9);
    }

    55% {
        left: 58%;
        top: 55%;
        transform:
            rotate(-7deg)
            scale(1.05);
    }

    70% {
        left: 25%;
        top: 68%;
        transform:
            rotate(5deg)
            scale(0.9);
    }

    85% {
        left: 4%;
        top: 48%;
        transform:
            rotate(-6deg)
            scale(0.82);
    }

    100% {
        left: -220px;
        top: 18%;
        transform:
            rotate(-8deg)
            scale(0.82);
    }
}

/* =====================================================
   CONTENEDOR
===================================================== */

.page {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        max(35px, env(safe-area-inset-top))
        20px
        max(25px, env(safe-area-inset-bottom));
}

/* =====================================================
   CABECERA / LOGO
===================================================== */

.hero {
    width: 100%;
    max-width: 900px;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 25px;
}

.logo {
    width: min(88vw, 650px);
    max-height: 220px;

    object-fit: contain;

    filter:
        drop-shadow(0 5px 8px rgba(0,0,0,0.9))
        drop-shadow(0 0 20px rgba(210,175,75,0.16));

    animation: logoAppear 1.5s ease-out;
}

@keyframes logoAppear {

    from {
        opacity: 0;
        transform: translateY(-20px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =====================================================
   FRASE
===================================================== */

.subtitle {
    margin-top: 4px;

    font-size: clamp(18px, 4vw, 26px);

    font-style: italic;

    letter-spacing: 2px;

    color: #e8d7aa;

    text-shadow:
        0 2px 8px #000,
        0 0 14px rgba(225,190,90,0.2);

    animation: fadeUp 1.5s ease-out;
}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =====================================================
   CUENTA ATRÁS
===================================================== */

const targetDate = Date.UTC(
    2026,
    10,
    5,
    0,
    0,
    0
);

function updateCountdown() {

    const now = Date.now();

    const difference = targetDate - now;

    const daysElement =
        document.getElementById("days");

    const hoursElement =
        document.getElementById("hours");

    const minutesElement =
        document.getElementById("minutes");

    const secondsElement =
        document.getElementById("seconds");


    if (difference <= 0) {

        daysElement.textContent = "000";
        hoursElement.textContent = "00";
        minutesElement.textContent = "00";
        secondsElement.textContent = "00";

        return;
    }


    const totalSeconds =
        Math.floor(difference / 1000);


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    daysElement.textContent =
        String(days).padStart(3, "0");

    hoursElement.textContent =
        String(hours).padStart(2, "0");

    minutesElement.textContent =
        String(minutes).padStart(2, "0");

    secondsElement.textContent =
        String(seconds).padStart(2, "0");
}


/* Primera actualización inmediata */

updateCountdown();


/* Actualización cada segundo */

setInterval(
    updateCountdown,
    1000
);
}

/* =====================================================
   BOTÓN COMPARTIR
===================================================== */

.share {

    margin-top: 27px;

    padding: 14px 30px;

    min-width: 230px;

    border:
        1px solid
        rgba(218,190,105,0.5);

    border-radius: 40px;

    background:
        rgba(4,12,8,0.55);

    color: #e6d49a;

    font-family: Georgia, serif;

    font-size: 12px;

    letter-spacing: 3px;

    cursor: pointer;

    transition:
        0.3s ease;

    backdrop-filter: blur(5px);
}

.share:hover {

    background:
        rgba(191,157,65,0.15);

    border-color: #e4c875;

    box-shadow:
        0 0 22px rgba(220,190,100,0.18);
}

.share:active {

    transform: scale(0.96);
}

/* =====================================================
   MENÚ
===================================================== */

.menu {

    width: 100%;
    max-width: 900px;

    margin-top: 48px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 14px;
}

.menu-button {

    min-height: 95px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(206,178,99,0.25);

    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            rgba(2,12,8,0.72),
            rgba(0,4,3,0.85)
        );

    color: #d8c58e;

    cursor: pointer;

    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;

    backdrop-filter: blur(5px);
}

.menu-button:hover {

    transform: translateY(-3px);

    border-color:
        rgba(224,194,110,0.65);

    background:
        rgba(30,38,22,0.65);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.4);
}

.menu-icon {

    font-size: 26px;

    margin-bottom: 9px;

    opacity: .85;
}

.menu-title {

    font-size: 11px;

    letter-spacing: 4px;

    text-transform: uppercase;
}

/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.78);

    backdrop-filter: blur(7px);
}

.modal.active {

    display: flex;
}

.modal-box {

    width: 100%;
    max-width: 500px;

    padding: 32px 25px;

    border:
        1px solid
        rgba(215,185,105,0.45);

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            rgba(7,20,13,0.97),
            rgba(2,8,5,0.98)
        );

    box-shadow:
        0 20px 70px rgba(0,0,0,0.7);
}

.modal-box h2 {

    margin-bottom: 15px;

    color: #e3cd8d;

    font-size: 24px;

    letter-spacing: 3px;

    text-align: center;
}

.modal-box p {

    color: #cfc6a8;

    line-height: 1.7;

    text-align: center;

    font-size: 15px;
}

.close {

    display: block;

    margin: 25px auto 0;

    padding: 10px 25px;

    border:
        1px solid
        rgba(215,185,105,0.4);

    border-radius: 30px;

    background: transparent;

    color: #d9c68d;

    cursor: pointer;

    font-family: Georgia, serif;
}

/* =====================================================
   PIE
===================================================== */

footer {

    margin-top: 40px;

    padding-bottom: 20px;

    text-align: center;

    font-size: 10px;

    letter-spacing: 4px;

    color:
        rgba(215,200,155,0.42);
}

.fan {

    margin-top: 10px;

    font-size: 8px;

    letter-spacing: 1.5px;

    color:
        rgba(215,200,155,0.25);
}

/* =====================================================
   MÓVIL
===================================================== */

@media (max-width: 500px) {

    .page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .hero {
        padding-top: 15px;
    }

    .logo {
        width: 94vw;
        max-height: 160px;
    }

    .subtitle {
        font-size: 17px;
    }

    .countdown-area {
        margin-top: 25px;
    }

    .date {
        letter-spacing: 4px;
        font-size: 11px;
    }

    .countdown {
        gap: 6px;
    }

    .time-box {
        min-height: 78px;
        border-radius: 6px;
    }

    .number {
        font-size: clamp(25px, 8vw, 38px);
    }

    .label {
        font-size: 8px;
        letter-spacing: 1.5px;
    }

    .share {
        margin-top: 20px;
        padding: 12px 22px;
    }

    .menu {
        margin-top: 30px;
        gap: 9px;
    }

    .menu-button {
        min-height: 78px;
    }

    .menu-icon {
        font-size: 21px;
    }

    .menu-title {
        font-size: 9px;
        letter-spacing: 2px;
    }

    #navi {
        width: 105px;
    }

}

</style>
</head>

<body>

    <footer>

    </footer>

</main>


<!-- =====================================================
     MODAL
===================================================== -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Noticias
        </h2>

        <p id="modalText">
        </p>

        <button class="close" id="closeModal">
            CERRAR
        </button>

    </div>

</div>
